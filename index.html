/* =====================================================================
   STYLES  — colors are variables at the top; change them to re-theme the page
   ===================================================================== */
:root{
  --navy:#102A43; --navy-2:#0B1F33; --blue:#1769AA; --teal:#16B8A6; --gold:#F4B942;
  --bg:#F3F7FC; --white:#fff; --text:#243447; --muted:#64748B; --border:#E3EAF3;
  --ol:#2E86FF; --ex:#0E3A9C;                       /* logo outline / logo extrusion */
  --f-display:"RLZ","RCAI",Tahoma,"Segoe UI",sans-serif;
  --f-latin:"RFK","RCAI","Segoe UI",system-ui,sans-serif;
  --f-body:"RCAI","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.8 var(--f-body);overflow-x:hidden}
img,svg{max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(100%,920px);margin-inline:auto;padding-inline:18px}
.ico{flex:none;display:inline-block}

/* ---------- HEADER (logo + ribbon) ---------- */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;
  background:
    radial-gradient(circle at 15% 8%,rgba(22,184,166,.42),transparent 42%),
    radial-gradient(circle at 88% 4%,rgba(139,92,246,.42),transparent 46%),
    radial-gradient(circle at 50% 100%,rgba(23,105,170,.55),transparent 60%),
    linear-gradient(180deg,#143a66 0%,#102A43 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.35) 1.2px,transparent 1.6px);background-size:26px 26px}
.hero-inner{position:relative;z-index:2;padding:clamp(34px,7vw,64px) 16px clamp(70px,11vw,110px)}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:clamp(34px,6vw,70px);display:block;z-index:3}

.logo{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;line-height:1}
.logo-ar{--fs:clamp(104px,29vw,214px);margin-bottom:.3em;font-family:var(--f-display);filter:drop-shadow(0 .05em .05em rgba(0,0,0,.4))}
.logo-en{--fs:clamp(50px,14vw,100px);display:flex;justify-content:center;direction:ltr;margin-top:clamp(4px,1.2vw,12px);font-family:var(--f-latin);font-weight:700;
  filter:drop-shadow(0 .05em .05em rgba(0,0,0,.4))}
.t3d{position:relative;display:inline-block;isolation:isolate;white-space:nowrap;font-size:var(--fs);line-height:1.12}
/* back layer = thick outline + downward extrusion */
.t3d::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;text-align:center;z-index:-1;
  color:var(--ol);text-shadow:var(--tsh)}
/* front layer = colorful gradient fill */
.t3d .fill{position:relative;display:block;padding:.34em .14em .56em;margin:-.34em -.14em -.56em;color:transparent;background-image:var(--fill);-webkit-background-clip:text;background-clip:text}
/* gloss */
.t3d .fill::after{content:attr(data-t);position:absolute;inset:0;padding:inherit;box-sizing:border-box;text-align:center;color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.7) 24%,rgba(255,255,255,0) 43%);-webkit-background-clip:text;background-clip:text}

.ribbon{position:relative;width:min(calc(100% - 70px),640px);margin:clamp(26px,5vw,40px) auto 0;z-index:2}

  background:linear-gradient(180deg,#27dcc4 0%,#13b3a1 55%,#0e9c8c 100%);

.ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:46px;height:100%;background:#0b7f73;z-index:1;box-shadow:0 5px 0 #075a52}
.ribbon::before{right:-34px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
.ribbon::after{left:-34px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}

.deco{position:absolute;z-index:1;pointer-events:none;animation:floaty 6s ease-in-out infinite}
.deco svg{display:block;fill:currentColor}
.d1{top:12%;right:5%;width:34px;color:var(--gold)}

.b3{top:30%;right:7%;width:50px;height:50px;background:linear-gradient(160deg,#b794ff,#8b5cf6);transform:rotate(10deg);animation-delay:-2.5s}

main{position:relative;z-index:4}
.sec{padding-block:clamp(22px,4vw,34px)}

/* stage cards (2 columns, not clickable) */
.stages{list-style:none;margin:0;padding:0 0 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vw,22px)}
.stage{position:relative;overflow:hidden;border-radius:26px;padding:12px 9px 9px;cursor:default;user-select:none;-webkit-user-select:none;

.th-orange{--g1:#FFC83D;--g2:#FF8A1F;--edge:#C9600A;--ink:#C2570A;--tint:#FFF0D9}
.th-teal{--g1:#3BE3C9;--g2:#10A596;--edge:#0A7A6F;--ink:#0B7A70;--tint:#DCF7F2}
.th-blue{--g1:#74B7FF;--g2:#3A68FF;--edge:#2142C4;--ink:#2447C9;--tint:#E3EBFF}
.th-purple{--g1:#E7A0FF;--g2:#A24BFF;--edge:#762BC0;--ink:#7A2FC6;--tint:#F3E3FF}

.num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 1.6rem/1 var(--f-display);box-shadow:0 4px 0 var(--e),0 8px 14px rgba(16,42,67,.18);background:var(--b)}

.n2{--b:linear-gradient(160deg,#3be3c9,#10a596);--e:#0a7a6f}
.n3{--b:linear-gradient(160deg,#74b7ff,#3a68ff);--e:#2142c4}
.steps .body{padding-top:6px;min-width:0}

.slider-ctl[hidden]{display:none!important}
.slider-ctl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:-6px}
.arrow{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(160deg,#3be3c9,#10a596);box-shadow:0 4px 0 #0a7a6f}

.join-wrap{padding-top:6px}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3600); }
function safeUrl(u) { try { const p = new URL(String(u || "").trim()); return /^https?:$/.test(p.protocol) ? p.href : ""; } catch (e) { return ""; } }
function waLink(msg) { const n = String(SITE.whatsapp.number || "").replace(/\D/g, ""); return n ? "https://wa.me/" + n + "?text=" + encodeURIComponent(msg || "") : ""; }
function setText(sel, txt) { $(sel).textContent = txt; }
function linkTo(sel, url, onMissing) {
  const a = $(sel);
  if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
  else { a.href = "#"; a.addEventListener("click", e => { e.preventDefault(); toast(onMissing); }); }
}

/* ---------- 3D logo: every letter = outline/extrusion layer + gradient layer ---------- */
const EN_FILLS = [
  "linear-gradient(180deg,#fffbd0 20%,#ffe85c 38%,#ffc21f 60%,#ff9a1a 80%)",
  "linear-gradient(180deg,#fff6b0 20%,#ffe040 38%,#ffb81c 60%,#ff8a14 80%)",
  "linear-gradient(180deg,#fffbd0 20%,#fff04f 38%,#ffd21f 60%,#ffa51a 80%)",
  "linear-gradient(180deg,#fff6b0 20%,#ffe640 38%,#ffbd1c 60%,#ff8f14 80%)",
  "linear-gradient(180deg,#fffbd0 20%,#ffec55 38%,#ffc81f 60%,#ff9a1a 80%)",
  "linear-gradient(180deg,#fff6b0 20%,#ffe340 38%,#ffb81c 60%,#ff8a14 80%)",
  "linear-gradient(180deg,#fffbd0 20%,#ffee55 38%,#ffcc1f 60%,#ff9d1a 80%)"
];
const EN_ROT = [-5, 3, -3, 4, -4, 3, -5], EN_Y = ["0em", "-.03em", ".02em", "-.04em", ".02em", "-.03em", "0em"];
function t3d(txt, cls, style) {
  const s = esc(txt);
  return '<span class="t3d ' + cls + '" data-t="' + s + '" style="' + (style || "") + '"><span class="fill" data-t="' + s + '">' + s + "</span></span>";
}
(function outlineShadows() {          /* round outline + downward extrusion, as em-based text-shadows */
  const parts = [], ring = (r, h, col, step) => { for (let a = 0; a < 360; a += step) parts.push((r * Math.cos(a * Math.PI / 180)).toFixed(3) + "em " + (r * Math.sin(a * Math.PI / 180) + h).toFixed(3) + "em 0 " + col); };
  ring(.095, 0, "var(--ol)", 12); ring(.07, 0, "var(--ol)", 24); ring(.045, 0, "var(--ol)", 30);
  [.03, .06, .09, .115].forEach(h => ring(.095, h, "var(--ex)", 15));
  document.documentElement.style.setProperty("--tsh", parts.join(","));
})();
(function buildLogo() {
  const b = SITE.brand;
  $("#logo").setAttribute("aria-label", b.arabic + " " + b.english);
  $("#logo").innerHTML =
    '<span class="logo-ar" aria-hidden="true">' + t3d(b.arabic, "ar-l") + "</span>" +
    '<span class="logo-en" aria-hidden="true">' +
    Array.from(b.english).map((ch, i) => ch === " " ? '<span style="width:.3em"></span>'
      : t3d(ch, "en-l", "--fill:" + EN_FILLS[i % EN_FILLS.length] + ";--r:" + EN_ROT[i % EN_ROT.length] + "deg;--y:" + EN_Y[i % EN_Y.length] + ";--d:" + (i * 0.14).toFixed(2) + "s")).join("") + "</span>";
  setText("#tagline", b.description);
  setText("#fAr", b.arabic); setText("#fEn", b.english);
  document.title = b.arabic + " " + b.english + " — " + b.description;
})();

/* ---------- team slider ---------- */
(function team() {
  setText("#t-team", SITE.texts.teamTitle); setText("#teamSub", SITE.texts.teamSub);
  const members = SITE.team || [], THEMES = ["orange", "teal", "blue", "purple"];
  const AV = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="36" r="19" fill="#fff"/><path d="M12 100c0-24 17-36 38-36s38 12 38 36z" fill="#fff"/></svg>';
  const track = $("#teamTrack");
  if (!members.length) { $(".slider").parentElement.parentElement.hidden = true; return; }
  track.innerHTML = members.map((m, i) => {
    const img = safeUrl(m.image);
    return '<article class="member th-' + THEMES[i % 4] + '" aria-roledescription="slide" aria-label="' + (i + 1) + " / " + members.length + '"><div class="band"></div><div class="avatar">' +
      (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : AV) + "</div><h3>" + esc(m.name) + "</h3><p>" + esc(m.role) + "</p></article>";
  }).join("");
  const slides = Array.from(track.children), ctl = $("#sliderCtl"), dots = $("#dots");
  dots.innerHTML = slides.map((_, i) => '<button class="dot" type="button" aria-label="' + (i + 1) + '" data-i="' + i + '"></button>').join("");
  const overflow = () => track.scrollWidth > track.clientWidth + 6;
  function current() {
    const c = track.getBoundingClientRect(), mid = c.left + c.width / 2; let best = 0, bd = 1e9;
    slides.forEach((s, i) => { const r = s.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - mid); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  function go(i) {
    i = (i + slides.length) % slides.length;
    const s = slides[i], rtl = getComputedStyle(track).direction === "rtl";
    const base = s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2;
    track.scrollTo({ left: rtl ? base - (track.scrollWidth - track.clientWidth) : base, behavior: "smooth" });
  }
  function sync() {
    ctl.hidden = !(slides.length > 1 && overflow());
    const cur = current(); Array.from(dots.children).forEach((d, i) => d.setAttribute("aria-current", String(i === cur)));
  }
  $("#prevBtn").addEventListener("click", () => go(current() - 1));
  $("#nextBtn").addEventListener("click", () => go(current() + 1));
  dots.addEventListener("click", e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i); });
  track.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(current() + (getComputedStyle(track).direction === "rtl" ? 1 : -1)); if (e.key === "ArrowRight") go(current() + (getComputedStyle(track).direction === "rtl" ? -1 : 1)); });
  let raf = 0; track.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }, { passive: true });
  window.addEventListener("resize", sync); sync(); requestAnimationFrame(() => { go(0); setTimeout(sync, 400); });

  /* auto-play: only while the slider is on screen, never while the visitor is touching or hovering it */
  const ms = +SITE.teamAutoplayMs || 0;
  if (ms > 0 && slides.length > 1 && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
    let visible = false, paused = false;
    if ("IntersectionObserver" in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { threshold: .4 }).observe(track);
    ["mouseenter", "focusin", "touchstart", "pointerdown"].forEach(ev => $("#slider").addEventListener(ev, () => { paused = true; }, { passive: true }));
    ["mouseleave", "focusout"].forEach(ev => $("#slider").addEventListener(ev, () => { paused = false; }));
    $("#slider").addEventListener("touchend", () => { setTimeout(() => { paused = false; }, 6000); }, { passive: true });
    setInterval(() => { if (visible && !paused && !document.hidden && overflow()) go(current() + 1); }, ms);
  }
})();
